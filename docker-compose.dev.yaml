name: zenmonk-website-dev

services:
  mongodb:
    container_name: zenmonk-website-mongodb
    image: mongo:8.0.28-noble
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-zenmonk_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-zenmonk-root-local-password}
      MONGO_INITDB_DATABASE: ${DB_NAME:-zenmonk-website}
    volumes:
      - mongodb_data:/data/db
    networks:
      - zenmonk-website-network

  mongo-bootstrap:
    container_name: zenmonk-website-mongo-bootstrap
    image: mongo:8.0.28-noble
    restart: "no"
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-zenmonk_root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-zenmonk-root-local-password}
      DB_USER: ${DB_USER:-zenmonk_app}
      DB_PASSWORD: ${DB_PASSWORD:-zenmonk-local-password}
      DB_NAME: ${DB_NAME:-zenmonk-website}
    command:
      - sh
      - -ec
      - >-
        mongosh --quiet --host mongodb --port 27017
        --username "$${MONGO_ROOT_USER}"
        --password "$${MONGO_ROOT_PASSWORD}"
        --authenticationDatabase admin
        /bootstrap/mongo-bootstrap.js
    volumes:
      - ./docker/mongo-bootstrap.js:/bootstrap/mongo-bootstrap.js:ro
    depends_on:
      - mongodb
    networks:
      - zenmonk-website-network

  mailpit:
    container_name: zenmonk-website-mailpit
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_FORWARD_PORT:-1025}:1025"
      - "${MAIL_WEB_UI_FORWARD_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATA_FILE: ${MAIL_STORAGE_PATH:-/data/mailpit.db}
    networks:
      - zenmonk-website-network

networks:
  zenmonk-website-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mailpit_data:
    driver: local
