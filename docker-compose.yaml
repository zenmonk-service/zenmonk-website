services:
  app:
    container_name: zenmonk-website
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    restart: always
    ports:
      - ${APP_FORWARD_PORT:-80}:${PORT:-3000}
    expose:
      - ${PORT:-3000}
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: zenmonk-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-user}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-zenmonk}
    ports:
      - ${DB_FORWARD_PORT:-27017}:27017
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: zenmonk-mongo-express
    restart: always
    ports:
      - ${MONGO_EXPRESS_FORWARD_PORT:-8081}:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER:-user}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD:-zenmonk}
      ME_CONFIG_MONGODB_URL: mongodb://${DB_USER:-user}:${DB_PASSWORD:-zenmonk}@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb

  mailhog:
    image: mailhog/mailhog:latest
    container_name: zenmonk-mailhog
    restart: always
    ports:
      - ${MAIL_PORT:-1025}:1025
      - ${MAIL_DASHBOARD_PORT:-8025}:8025

volumes:
  mongodb_data: